name: Promote RC to stable release

on:
  workflow_dispatch:
    inputs:
      rc_tag:
        description: "RC tag to promote (e.g. v1.5.0-rc.2)"
        required: true
        type: string
      release_notes_extra:
        description: "Optional message to prepend to auto-generated release notes"
        required: false
        type: string
        default: ""

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: promote-${{ github.ref }}
  cancel-in-progress: false

jobs:
  promote:
    name: Promote RC to stable
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: ./.github/actions/setup

      - name: Validate RC tag and compute stable version
        id: version
        env:
          RC_TAG: ${{ inputs.rc_tag }}
        run: |
          set -euo pipefail
          TAG="${RC_TAG}"
          if [[ ! "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-(rc|beta|alpha)\.[0-9]+$ ]]; then
            echo "::error::Tag must look like v1.5.0-rc.1; got '${TAG}'"
            exit 1
          fi
          STABLE_VERSION="${BASH_REMATCH[1]}"
          STABLE_TAG="v${STABLE_VERSION}"
          echo "rc_tag=$TAG"                  >> "$GITHUB_OUTPUT"
          echo "stable_version=$STABLE_VERSION" >> "$GITHUB_OUTPUT"
          echo "stable_tag=$STABLE_TAG"       >> "$GITHUB_OUTPUT"
          echo "Promoting ${TAG} -> ${STABLE_TAG}"

      - name: Close versioned milestone
        env:
          TOKEN: ${{ secrets.OPENSCREEN_RELEASE_TOKEN }}
          STABLE_VERSION: ${{ steps.version.outputs.stable_version }}
        run: node .github/scripts/release-milestone-close.mjs

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Bump the version to stable on the release branch
        env:
          TOKEN: ${{ secrets.OPENSCREEN_RELEASE_TOKEN }}
          STABLE_VERSION: ${{ steps.version.outputs.stable_version }}
        run: |
          set -euo pipefail
          # Taken from the dispatched ref before the release branch is checked out: a frozen
          # branch cut before this script existed would not have it.
          cp .github/scripts/refresh-nix-npm-hash.sh "$RUNNER_TEMP/"
          # Promote checks out the FROZEN release branch (created by prerelease.yml) and
          # rewrites the version there. This guarantees the stable tag points at the
          # same code that was tested as the RC plus any cherry-picked bugfixes.
          BRANCH="release/v${STABLE_VERSION}"
          git fetch origin "$BRANCH"
          git checkout "$BRANCH"
          git reset --hard "origin/${BRANCH}"
          # Writes package-lock.json too. A sed over package.json alone left the
          # lockfile behind on every release up to 1.9.0; see the script header.
          node .github/scripts/set-release-version.mjs "${STABLE_VERSION}"
          # The lockfile's version is part of Nix's npm hash: refresh it in this same commit.
          bash "$RUNNER_TEMP/refresh-nix-npm-hash.sh"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json nix/package.nix
          git commit --allow-empty -m "chore(release): bump to ${STABLE_VERSION} [skip ci]" || true
          git push "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BRANCH"

      - name: Push stable tag on the release branch tip
        env:
          # Use GITHUB_TOKEN for the tag push: a tag is a ref, not a file change, so
          # the workflows:write permission isn't needed.
          # Note: GITHUB_TOKEN tag pushes do NOT trigger build.yml in this org's setup,
          # so we explicitly trigger it via gh workflow run right after.
          STABLE_TAG: ${{ steps.version.outputs.stable_tag }}
          STABLE_VERSION: ${{ steps.version.outputs.stable_version }}
        run: |
          set -euo pipefail
          BRANCH="release/v${STABLE_VERSION}"
          git fetch origin "$BRANCH"
          git checkout "$BRANCH"
          git reset --hard "origin/${BRANCH}"
          # Delete remote tag first (idempotent on rerun) and any local tag.
          git push origin ":${STABLE_TAG}" 2>/dev/null || true
          git tag -d "$STABLE_TAG" 2>/dev/null || true
          git tag "$STABLE_TAG"
          git push origin "$STABLE_TAG"

      # ORDER MATTERS. Everything that actually publishes the release runs before the
      # main-sync below. The stable tag is already pushed at this point, so the build
      # and the announcement depend on nothing the sync produces — while the sync is a
      # PR round-trip against a remote that fails for reasons of its own. It used to
      # run first, and every one of its failures silently skipped both steps under it:
      # v1.7.0, v1.8.0 and v1.9.0 all shipped without an automated build (dispatched by
      # hand minutes later) and without a #releases announcement.
      - name: Trigger build workflow
        env:
          GH_TOKEN: ${{ secrets.OPENSCREEN_RELEASE_TOKEN }}
          STABLE_TAG: ${{ steps.version.outputs.stable_tag }}
        run: |
          set -euo pipefail
          # GITHUB_TOKEN tag pushes don't fire build.yml in this setup, dispatch it.
          #
          # --ref pins the build to the stable tag (the frozen release-branch tip), which
          # is also what makes running this before the main-sync correct: the tag already
          # points at the released snapshot, so checkout gets the matching package.json +
          # code whatever main looks like, and signing/notarization is enabled (tag has
          # no '-').
          gh workflow run build.yml \
            --ref "${STABLE_TAG}" \
            -f release_tag="${STABLE_TAG}" \
            -f arch=both \
            --repo "$GITHUB_REPOSITORY"

      # No announcement step here any more. It moved to announce-release.yml, which
      # runs on `release: published` — the one event every release path shares,
      # including a tag pushed straight to build.yml with no promotion at all. This
      # step could only ever announce what THIS workflow did, and it announced it
      # from here, before build.yml had produced a single asset.
      #
      # `release_notes_extra` consequently no longer reaches Discord from this
      # workflow. Pass it to the announce dispatch instead when there is something
      # to prepend; the automatic run posts the standard message.

      # Bookkeeping, not publishing: the release is already out by now. Allowed to fail
      # so a stuck PR never masks a successful release — the summary reports it and it
      # is trivially redone by hand.
      - name: Sync the released version into main
        id: sync_main
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.OPENSCREEN_RELEASE_TOKEN }}
          STABLE_VERSION: ${{ steps.version.outputs.stable_version }}
        run: |
          set -euo pipefail
          # Main gets the release's version, not its history. Every fix on the release
          # branch is a cherry-pick of a commit already on main, so the version bumps are
          # all main lacks. This step used to rebase-merge the whole release branch,
          # replaying those cherry-picks too, and once main had moved on they no longer
          # applied: v2.1.0's sync PR (#1312) failed five times and main stayed at 2.0.0
          # until #1313 did by hand what this step does now. The PR is rebase-merged via
          # the PAT, a ruleset bypass actor, so no approval is needed.
          BRANCH="release/v${STABLE_VERSION}"
          git fetch origin main "$BRANCH"
          main_version() {
            git show origin/main:package.json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version'
          }
          # From here on, main's own scripts: a release branch cut before one of them
          # existed would not have it.
          git checkout -B "${BRANCH}-sync" origin/main
          # A fix committed to the release branch alone would be left out of a
          # version-only sync. Name it, sync the version anyway, and fail the step so
          # the summary says main is incomplete.
          UNSYNCED=$(git cherry -v origin/main "origin/${BRANCH}" | node .github/scripts/release-unsynced-fixes.mjs)
          finish() {
            if [[ -n "$UNSYNCED" ]]; then
              echo "::error::origin/${BRANCH} has commits main lacks, and the version sync leaves them out. Cherry-pick them onto main, or check that main has them in another form:"
              echo "$UNSYNCED"
              exit 1
            fi
            exit 0
          }
          if [[ "$(main_version)" == "$STABLE_VERSION" ]]; then
            echo "main is already at ${STABLE_VERSION}: nothing to sync."
            finish
          fi
          node .github/scripts/set-release-version.mjs "${STABLE_VERSION}"
          # The lockfile's version is part of Nix's npm hash, and the hash must match
          # main's lockfile, not the release's.
          bash .github/scripts/refresh-nix-npm-hash.sh
          git add package.json package-lock.json nix/package.nix
          git commit -m "chore(release): release v${STABLE_VERSION} into main"
          # --force: a rerun commits again on top of a newer main.
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "${BRANCH}-sync"
          gh pr create \
            --base main \
            --head "${BRANCH}-sync" \
            --title "chore(release): release v${STABLE_VERSION} into main" \
            --body "Sets main to ${STABLE_VERSION}, the version just released. The fixes on ${BRANCH} are cherry-picks already on main. Rebase-merged via PAT; bypass applies because EtienneLescot is a ruleset bypass actor." \
            --repo "$GITHUB_REPOSITORY" || echo "(PR already exists — skipping)"
          PR_NUMBER=$(gh pr list --head "${BRANCH}-sync" --state open --json number -q '.[0].number' --repo "$GITHUB_REPOSITORY")
          if [[ -z "$PR_NUMBER" ]]; then
            # L'échec de `gh pr create` ci-dessus est converti en echo, donc on
            # arrive ici aussi bien quand la PR existait déjà que quand sa création
            # a échoué pour une autre raison. Sortir en 0 dans le second cas
            # reportait sync_main en succès alors que le test de version du haut
            # avait justement établi que main n'est pas à jour, et l'avertissement
            # de fin sautait. On re-teste plutôt que de supposer : quelqu'un a pu
            # merger la synchro à la main entre-temps.
            git fetch origin main
            if [[ "$(main_version)" == "$STABLE_VERSION" ]]; then
              echo "main is already at ${STABLE_VERSION}: nothing to sync."
              finish
            fi
            echo "::error::No open sync PR exists and main is not at ${STABLE_VERSION}."
            exit 1
          fi
          # GitHub computes mergeability asynchronously. Merging ~3s after creating the
          # PR raced that computation every time: v1.9.0 got "This branch can't be
          # rebased" 2.9s after create, v1.8.0 "has merge conflicts" after 1.7s — and
          # both merged by hand, unchanged, minutes later. Wait for a real verdict.
          for _ in $(seq 1 30); do
            STATE=$(gh pr view "$PR_NUMBER" --json mergeStateStatus -q .mergeStateStatus \
              --repo "$GITHUB_REPOSITORY" 2>/dev/null || echo UNKNOWN)
            echo "mergeStateStatus=${STATE}"
            if [[ "$STATE" != "UNKNOWN" ]]; then break; fi
            sleep 5
          done
          # Retry anyway: leaving UNKNOWN is necessary, not sufficient. MERGED must be
          # set by a successful merge — a bare `&& break` loop exits 0 after five
          # failures and reports a merge that never happened.
          MERGED=0
          for _ in $(seq 1 5); do
            if gh pr merge "$PR_NUMBER" --rebase --delete-branch --admin \
              --repo "$GITHUB_REPOSITORY"; then
              MERGED=1
              break
            fi
            sleep 15
          done
          if [[ "$MERGED" -ne 1 ]]; then
            echo "::error::Could not rebase-merge sync PR #${PR_NUMBER} into main after 5 attempts. The release itself is published; merge it by hand."
            exit 1
          fi
          # The release branch itself was already used to publish and contains frozen
          # history — leave it in place for forensics. A v1.6.0 release branch should
          # never be deleted until the next major cuts over.
          finish

      - name: Workflow summary
        run: |
          {
            echo "## Release promoted"
            echo ""
            echo "- Stable tag: \`${{ steps.version.outputs.stable_tag }}\`"
            echo "- Promoted from: \`${{ steps.version.outputs.rc_tag }}\`"
            echo "- Tier 3 (homebrew/winget/nix/aur) will fire on the published release via OPENSCREEN_RELEASE_TOKEN."
            if [[ "${{ steps.sync_main.outcome }}" != "success" ]]; then
              echo ""
              echo "> [!WARNING]"
              echo "> **main was not synced.** The release is published and the build was"
              echo "> dispatched. The \`Sync the released version into main\` step's error says what is"
              echo "> left: the \`release/v${{ steps.version.outputs.stable_version }}-sync\` → main PR to merge by hand,"
              echo "> or release-branch commits that main lacks."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
