<!-- @dsCard group="Colors" viewport="700x150" subtitle="Timeline candy: green clip, blue zoom, dark ink" name="Semantic" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-display);padding:20px;display:flex;gap:12px;flex-wrap:wrap;}
  /* .lanePill / .tlClip in src/components/ai-edition/v4/EditorShellV4.module.css */
  .pill{--_c:var(--accent);display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px 0 8px;border-radius:8px;font-size:12px;font-weight:600;box-sizing:border-box;color:#0b1220;
    background:linear-gradient(180deg,color-mix(in oklab,var(--_c) 72%,white),var(--_c));box-shadow:0 2px 6px color-mix(in oklab,var(--_c) var(--candy-glow),transparent);}
  .clip{--_c:var(--clip);width:120px;height:34px;border-radius:12px;background:linear-gradient(180deg,color-mix(in oklab,var(--_c) 78%,white),var(--_c));}
  .sw{display:flex;flex-direction:column;gap:8px;}
  .hex{font-family:var(--font-mono);font-size:9.5px;color:var(--meta);}
</style></head>
<body>
  <div class="sw"><span class="pill clip">demo.mp4</span><span class="hex">clip · var(--accent)</span></div>
  <div class="sw"><span class="pill" style="--_c:var(--zoom)">Zoom 1.8×</span><span class="hex">zoom · #3b82f6</span></div>
  <div class="sw"><span class="pill" style="--_c:var(--annotation)">Annotation</span><span class="hex">annotation</span></div>
  <div class="sw"><span class="pill" style="--_c:var(--speed)">1.5×</span><span class="hex">speed</span></div>
  <div class="sw"><span class="pill" style="--_c:var(--danger)">Trim</span><span class="hex">danger</span></div>
  <div class="sw"><span class="pill" style="--_c:#a855f7">Camera</span><span class="hex">camera · #a855f7</span></div>
</body></html>
