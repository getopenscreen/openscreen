<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 360' role='img' aria-label='A prompt becomes one compositor pass, the same for preview and export' font-size='13' font-family='Inter, system-ui, -apple-system, Segoe UI, sans-serif'>
<rect width='760' height='360' fill='#ffffff'/>
<defs><marker id='arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#8c959f'/></marker></defs>
<text x='24' y='28' font-size='15' font-weight='600' fill='#1f2328'>A prompt becomes one compositor pass, the same for preview and export</text>
<g fill='none' stroke='#8c959f' stroke-width='1.25'><path d='M175 120H205' marker-end='url(#arrow)'/><path d='M355 120H385' marker-end='url(#arrow)'/><path d='M535 120H565' marker-end='url(#arrow)'/><path d='M640 158V252' marker-end='url(#arrow)'/><path d='M565 290H535' marker-end='url(#arrow)'/><path d='M385 290H355' marker-end='url(#arrow)'/><path d='M280 252V158' marker-end='url(#arrow)'/><path d='M460 82V64H280V82' marker-end='url(#arrow)'/></g>
<rect x='25' y='82' width='150' height='76' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25'/><text x='100' y='116' text-anchor='middle' font-weight='600' fill='#1f2328'>Prompt</text><text x='100' y='134' text-anchor='middle' font-size='11.5' fill='#57606a'>“ripple on click”</text>
<rect x='205' y='82' width='150' height='76' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25'/><text x='280' y='116' text-anchor='middle' font-weight='600' fill='#1f2328'>AI agent</text><text x='280' y='134' text-anchor='middle' font-size='11.5' fill='#57606a'>writes the WGSL</text>
<rect x='385' y='82' width='150' height='76' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25'/><text x='460' y='106' text-anchor='middle' font-weight='600' fill='#1f2328'>addEffect</text><text x='460' y='124' text-anchor='middle' font-size='11.5' fill='#57606a'>real compilation</text><text x='460' y='140' text-anchor='middle' font-size='11.5' fill='#57606a'>naga, then FXC</text>
<rect x='565' y='82' width='150' height='76' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25'/><text x='640' y='106' text-anchor='middle' font-weight='600' fill='#1f2328'>Project</text><text x='640' y='124' text-anchor='middle' font-size='11.5' fill='#57606a'>source + region</text><text x='640' y='140' text-anchor='middle' font-size='11.5' fill='#57606a'>anchored to a clip</text>
<rect x='565' y='252' width='150' height='76' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25'/><text x='640' y='276' text-anchor='middle' font-weight='600' fill='#1f2328'>Scene</text><text x='640' y='294' text-anchor='middle' font-size='11.5' fill='#57606a'>described once</text><text x='640' y='310' text-anchor='middle' font-size='11.5' fill='#57606a'>for all rendering</text>
<rect x='385' y='252' width='150' height='76' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25'/><text x='460' y='276' text-anchor='middle' font-weight='600' fill='#1f2328'>Compositor</text><text x='460' y='294' text-anchor='middle' font-size='11.5' fill='#57606a'>effect pass</text><text x='460' y='310' text-anchor='middle' font-size='11.5' fill='#57606a'>compiled off-thread</text>
<rect x='205' y='252' width='150' height='76' rx='8' fill='#2f6feb' fill-opacity='0.12' stroke='#2f6feb' stroke-width='2'/><text x='280' y='286' text-anchor='middle' font-weight='600' fill='#1f2328'>Preview + export</text><text x='280' y='304' text-anchor='middle' font-size='11.5' fill='#1f2328'>same pixels</text>
<text x='370' y='56' text-anchor='middle' font-size='11.5' fill='#57606a'>refused: error at line and column</text>
<text x='290' y='200' font-size='11.5' fill='#57606a'>getFrames: the agent</text>
<text x='290' y='216' font-size='11.5' fill='#57606a'>looks at the frames</text>
</svg>
